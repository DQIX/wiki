<!doctype html>
<!--
  A browser for this wiki's Markdown, for GitHub Pages or a local server.
  The same .md files work unchanged as a GitHub wiki; this page only reads them.

  Pages are `<Name>.md` beside this file, `Home.md` first, `_Sidebar.md` the
  navigation. Links are written the GitHub wiki way, `[text](Page-Name)`, and
  come out here as `?p=Page-Name`.

  Needs a web server — browsers will not fetch files over file://. Locally:
  ./serve.sh, then http://localhost:8000/
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DQIX Formats</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0;
    --panel: #f6f8fa; --link: #0969da; --code-bg: #eff1f3; --current: #ddf4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d;
      --panel: #151b23; --link: #4493f8; --code-bg: #262c36; --current: #1f3a5f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Noto Sans CJK JP";
    display: grid; grid-template-columns: 17rem minmax(0, 1fr); min-height: 100vh;
  }
  nav {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 1rem 1.25rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; font-size: 14px;
  }
  nav ul { list-style: none; padding: 0; margin: 0 0 .75rem; }
  nav li a { display: block; padding: .15rem .5rem; border-radius: 6px; }
  nav li a[aria-current="page"] { background: var(--current); font-weight: 600; }
  nav p { margin: .75rem 0 .25rem; }
  #filter {
    width: 100%; padding: .4rem .6rem; margin-bottom: .5rem; font: inherit;
    color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  main { padding: 2rem 2.5rem 4rem; max-width: 60rem; }
  main { overflow-wrap: anywhere; }
  main table { overflow-wrap: normal; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1, h2, h3 { line-height: 1.25; }
  h1 { border-bottom: 1px solid var(--line); padding-bottom: .3em; }
  h2 { border-bottom: 1px solid var(--line); padding-bottom: .3em; margin-top: 2em; }
  code { background: var(--code-bg); padding: .1em .35em; border-radius: 4px; font-size: 88%;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  pre { background: var(--code-bg); padding: 1rem; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; display: block; overflow-x: auto; margin: 1rem 0; }
  th, td { border: 1px solid var(--line); padding: .35rem .75rem; vertical-align: top; }
  th { background: var(--panel); text-align: left; }
  blockquote { margin: 0; padding: 0 1rem; color: var(--muted); border-left: .25em solid var(--line); }
  .notice { color: var(--muted); }
  #menu { display: none; }
  @media (max-width: 800px) {
    body { display: block; }
    nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: .75rem 16px; }
    nav:not(.open) > :not(#menu) { display: none; }
    #menu { display: block; font: inherit; color: var(--fg); background: none; border: 1px solid var(--line);
      border-radius: 6px; padding: .3rem .7rem; }
    main { padding: 1rem 16px 3rem; }
  }
</style>
</head>
<body>
<nav id="nav">
  <button id="menu" type="button" aria-expanded="false">Contents</button>
  <input id="filter" type="search" placeholder="Filter pages" aria-label="Filter pages">
  <div id="sidebar"></div>
</nav>
<main id="page"><p class="notice">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  const HOME = 'Home'
  const cache = new Map()

  // A link written the wiki way — no scheme, no slash, no extension — names a page.
  function wikiTarget(href) {
    const m = /^([A-Za-z0-9][\w-]*)(#.*)?$/.exec(href ?? '')
    return m ? { page: m[1], hash: m[2] ?? '' } : null
  }
  const pageUrl = (page, hash = '') => `?p=${encodeURIComponent(page)}${hash}`

  // GitHub's heading anchors: lower case, punctuation dropped, spaces to hyphens.
  function slug(text, seen) {
    let s = text.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-')
    const n = seen.get(s) ?? 0
    seen.set(s, n + 1)
    return n ? `${s}-${n}` : s
  }

  async function load(page) {
    if (!cache.has(page)) {
      cache.set(page, fetch(`${encodeURIComponent(page)}.md`).then((r) => (r.ok ? r.text() : null)))
    }
    return cache.get(page)
  }

  function render(markdown, into) {
    into.innerHTML = marked.parse(markdown, { gfm: true })
    for (const a of into.querySelectorAll('a[href]')) {
      const target = wikiTarget(a.getAttribute('href'))
      if (target) a.href = pageUrl(target.page, target.hash)
      else if (/^https?:/.test(a.getAttribute('href'))) a.rel = 'noopener'
    }
    const seen = new Map()
    for (const h of into.querySelectorAll('h1, h2, h3, h4, h5, h6')) h.id = slug(h.textContent, seen)
  }

  const currentPage = () => new URLSearchParams(location.search).get('p') || HOME

  async function show() {
    const page = currentPage()
    const main = document.getElementById('page')
    const text = await load(page)
    if (text === null) {
      main.innerHTML = `<h1>Not found</h1><p class="notice">There is no page called <code></code>. <a href="${pageUrl(HOME)}">Home</a></p>`
      main.querySelector('code').textContent = page
      document.title = 'Not found · DQIX Formats'
    } else {
      render(text, main)
      const h1 = main.querySelector('h1')
      document.title = h1 && page !== HOME ? `${h1.textContent} · DQIX Formats` : 'DQIX Formats'
    }
    for (const a of document.querySelectorAll('#sidebar a')) {
      const target = wikiTarget(new URLSearchParams(a.search).get('p'))
      if (target?.page === page) a.setAttribute('aria-current', 'page')
      else a.removeAttribute('aria-current')
    }
    const anchor = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)))
    if (anchor) anchor.scrollIntoView()
    else window.scrollTo(0, 0)
  }

  // Wiki links move within the page without a reload; everything else is left to the browser.
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href]')
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return
    const url = new URL(a.href)
    if (url.origin !== location.origin || url.pathname !== location.pathname || !url.searchParams.has('p')) return
    e.preventDefault()
    const samePage = url.search === location.search
    history.pushState(null, '', url)
    if (samePage && url.hash) document.getElementById(decodeURIComponent(url.hash.slice(1)))?.scrollIntoView()
    else show()
    document.getElementById('nav').classList.remove('open')
  })
  window.addEventListener('popstate', show)

  document.getElementById('menu').addEventListener('click', (e) => {
    const open = document.getElementById('nav').classList.toggle('open')
    e.currentTarget.setAttribute('aria-expanded', String(open))
  })

  // The filter hides sidebar entries, and a group's heading when none of its entries is left.
  document.getElementById('filter').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase()
    for (const li of document.querySelectorAll('#sidebar li')) {
      li.hidden = q !== '' && !li.textContent.toLowerCase().includes(q)
    }
    for (const ul of document.querySelectorAll('#sidebar ul')) {
      const empty = [...ul.children].every((li) => li.hidden)
      ul.hidden = empty
      const label = ul.previousElementSibling
      if (label?.tagName === 'P') label.hidden = empty
    }
  })

  ;(async () => {
    if (typeof marked === 'undefined') {
      document.getElementById('page').innerHTML =
        '<h1>Could not load</h1><p class="notice">The Markdown renderer did not load from cdn.jsdelivr.net.</p>'
      return
    }
    const sidebar = await load('_Sidebar')
    if (sidebar !== null) render(sidebar, document.getElementById('sidebar'))
    await show()
  })()
</script>
</body>
</html>
